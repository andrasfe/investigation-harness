[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout"
version = "0.1.0"
description = "Investigation harness for Java test-generation target selection (SPEC.md)"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31",
]

[project.scripts]
scout = "scout.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scout*"]
